[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "oceans-glwl"
version = "0.1.0"
description = "Reproducible Lake Superior water-level forecasting experiments for OCEANS 2026"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = {file = "LICENSE"}
authors = [
  {name = "Alexander Stinnett"},
  {name = "Timothy C. Havens"},
  {name = "Pengfei Xue"},
]
dependencies = [
  "jinja2>=3.1,<4",
  "matplotlib>=3.8,<3.11",
  "numpy>=1.26,<2.5",
  "pandas>=2.2,<2.4",
  "pyarrow>=15,<25",
]

[project.optional-dependencies]
training = [
  "neuralforecast>=3.2,<3.3",
  "torch>=2.2",
]
hpo = [
  "optuna>=4.0,<5",
]
distributed = [
  "optuna>=4.0,<5",
  "psycopg[binary]>=3.1,<4",
  "sqlalchemy>=2.0,<3",
]
dev = [
  "coverage[toml]>=7.6",
  "mypy>=1.13",
  "pytest>=8.3",
  "ruff>=0.8",
]

[project.scripts]
oceans-glwl = "oceans_glwl.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/oceans_glwl"]

[tool.pytest.ini_options]
addopts = "-ra -m 'not training and not distributed'"
testpaths = ["tests"]
markers = [
  "training: requires optional training dependencies",
  "distributed: requires optional PostgreSQL/distributed dependencies",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
packages = ["oceans_glwl"]
check_untyped_defs = true
ignore_missing_imports = true
warn_unused_ignores = true
